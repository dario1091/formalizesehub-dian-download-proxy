# =====================================================
# CI/CD — formalizesehub-dian-download-proxy
# develop → deploy a dev | main → deploy a prod
# =====================================================
name: Deploy Lambda

on:
  push:
    branches:
      - develop
      - main

env:
  AWS_REGION: sa-east-1
  NODE_VERSION: "20"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name formalizese-dian-download-proxy-${{ steps.env.outputs.environment }} \
            --zip-file fileb://dist.zip

      - name: Deploy summary
        run: |
          echo "✅ formalizese-dian-download-proxy-${{ steps.env.outputs.environment }} deployed"
